# Integración continua: formato, análisis, pruebas y compilaciones.
# No despliega nada: los despliegues se hacen manualmente (ver docs/DESPLIEGUE.md).
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.1"
  NODE_VERSION: "24"

jobs:
  flutter:
    name: Flutter (formato, análisis, pruebas, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas unitarias y de widgets
        run: flutter test
      - name: Compilación web
        run: flutter build web --release

  android:
    name: Compilación Android de prueba
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  functions:
    name: Cloud Functions (lint, build, pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  firebase-emulator:
    name: Reglas e integración (Firebase Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Firebase CLI
        run: npm install -g firebase-tools@15
      - name: Dependencias
        run: |
          npm ci --prefix functions
          npm ci --prefix tests/firebase
      - name: Secretos ficticios para el emulador
        # Valores de prueba (nunca reales); el emulador los lee de .secret.local.
        run: cp functions/.secret.local.example functions/.secret.local
      - name: Pruebas de reglas
        working-directory: tests/firebase
        run: npm run test:rules
      - name: Prueba de integración del flujo QR
        working-directory: tests/firebase
        run: npm run test:integration
